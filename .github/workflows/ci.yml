name: My First CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project Files
        run: ls -la

      - name: Validate HTML File
        run: |
          test -f index.html
          grep -q "My First GitHub Actions Project" index.html
          echo "HTML validation passed!"

      - name: Pipeline Success
        run: echo "My first CI pipeline completed successfully!"
